name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache removed because no package-lock.json yet

      - name: Install dependencies (if any)
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found – static site, skipping install"
          fi

      - name: Lint (optional)
        run: |
          if [ -f package.json ] && npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script – skipping"
          fi
        continue-on-error: true

      - name: Build (optional)
        run: |
          if [ -f package.json ] && npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script – static site ready"
          fi
        continue-on-error: true

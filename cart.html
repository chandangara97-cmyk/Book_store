<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart – The Reading Nook</title>
  <link rel="stylesheet" href="css/style.css" />
<style>.gift-rewards{margin:24px 0;padding:22px;background:#fff9e8;border:1px solid #f0d98f;border-radius:18px}.gift-rewards h3{margin:0 0 8px}.gift-rewards p{margin:0 0 12px}.reward-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #efdfad}.reward-line small,.gift-rewards>small{color:var(--text-muted);font-size:.82rem}.reward-line.unlocked{color:#23623b}.reward-line .btn{white-space:nowrap}@media(max-width:540px){.reward-line{align-items:flex-start;flex-direction:column}}</style></head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">✦</div>
        <div class="logo-text">
          <h1>THE READING NOOK</h1>
          <span>Books · Ideas · Possibilities</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="wishlist.html" class="icon-btn" title="Wishlist">♡</a>
        <a href="cart.html" class="icon-btn" title="Cart">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <h1>Your Cart</h1>
    <p>Review your books, toys and unlocked gifts before checkout.</p>
  </div>

  <div class="container">
    <a href="index.html" class="back-link">← Continue Shopping</a>

    <div id="cartContent">
      <!-- Filled by JS -->
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 The Reading Nook</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    function renderCart() {
      let cart = getCart();
      const paidSubtotal = cart.filter(i => i.type !== 'gift').reduce((sum, i) => sum + (Number(i.price) || 0) * (Number(i.qty) || 0), 0);
      cart.filter(i => (i.id === 'gift-colouring-kit' && paidSubtotal < 999) || (i.id === 'gift-mini-toy' && paidSubtotal < 1499)).forEach(i => removeFromCart(i.id));
      cart = getCart();
      const container = document.getElementById('cartContent');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🛒</div>
            <h3>Your cart is empty</h3>
            <p style="margin: 12px 0 24px;">Discover something wonderful to read.</p>
            <a href="library/all.html" class="btn">Browse Books</a>
          </div>
        `;
        return;
      }

      let rows = '';
      cart.forEach(item => {
        rows += `
          <tr data-id="${item.id}">
            <td>
              <div class="cart-item-info">
                <div class="cart-item-cover">${coverHTML(item)}</div>
                <div>
                  <strong>${item.title}</strong><br><span style="font-size:.8rem;color:var(--text-muted)">${item.type === 'toy' ? 'Toy / learning kit' : item.type === 'gift' ? 'FREE GIFT' : 'Book'}</span><br>
                  <span style="color:var(--text-muted);font-size:0.9rem;font-family:system-ui">${item.author}</span>
                </div>
              </div>
            </td>
            <td>${item.type === 'gift' ? 'FREE' : '₹'+item.price}</td>
            <td>
              <div class="qty-control">
                <button onclick="changeQty('${item.id}', -1)">−</button>
                <input type="number" value="${item.qty}" min="1" onchange="setQty('${item.id}', this.value)" />
                <button onclick="changeQty('${item.id}', 1)">+</button>
              </div>
            </td>
            <td><strong>${item.type === 'gift' ? 'FREE' : '₹'+(item.price * item.qty)}</strong></td>
            <td>
              <button class="btn btn-sm btn-outline" onclick="removeItem('${item.id}')">Remove</button>
            </td>
          </tr>
        `;
      });

      const total = getCartTotal();
      const hasGift = id => cart.some(i => i.id === id);
      const rewardHtml = `<div class="gift-rewards"><h3>🎁 Your book + toy rewards</h3><p>Merchandise subtotal: <strong>₹${total}</strong></p><div class="reward-line ${total >= 999 ? 'unlocked' : ''}"><span>₹999 — Free colouring kit</span>${total >= 999 ? (hasGift('gift-colouring-kit') ? '<strong>Added ✓</strong>' : '<button class="btn btn-sm" onclick="addReward(999)">Choose free gift</button>') : `<small>Spend ₹${999-total} more</small>`}</div><div class="reward-line ${total >= 1499 ? 'unlocked' : ''}"><span>₹1,499 — Free mini toy</span>${total >= 1499 ? (hasGift('gift-mini-toy') ? '<strong>Added ✓</strong>' : '<button class="btn btn-sm" onclick="addReward(1499)">Choose free gift</button>') : `<small>Spend ₹${Math.max(0,1499-total)} more</small>`}</div><small>Rewards are complimentary, subject to stock. Shipping is calculated separately.</small></div>`;
      container.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        ${rewardHtml}
        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>₹${total}</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>${total >= 499 ? 'Free' : '₹49'}</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>₹${total >= 499 ? total : total + 49}</span>
          </div>
          <button class="btn btn-block" style="margin-top:20px" onclick="checkout()">
            Proceed to Checkout
          </button>
          <p style="font-size:0.8rem;color:var(--text-muted);margin-top:12px;font-family:system-ui;text-align:center">
            Free shipping on orders above ₹499
          </p>
        </div>
      `;
    }

    function addReward(threshold) {
      const total = getCartTotal();
      if (threshold === 999 && total >= 999) addToCart({id:'gift-colouring-kit',title:'Complimentary Colouring Kit',author:'The Reading Nook',price:0,cover:'🎨',category:'Gift',type:'gift'});
      else if (threshold === 1499 && total >= 1499) addToCart({id:'gift-mini-toy',title:'Complimentary Mini Toy',author:'The Reading Nook',price:0,cover:'🧸',category:'Gift',type:'gift'});
      renderCart();
    }

    function changeQty(id, delta) {
      const item = getCart().find(i => i.id === id);
      if (item) {
        updateCartQty(id, item.qty + delta);
        renderCart();
      }
    }

    function setQty(id, value) {
      updateCartQty(id, parseInt(value) || 1);
      renderCart();
    }

    function removeItem(id) {
      removeFromCart(id);
      renderCart();
      showToast('Item removed from cart');
    }

    function checkout() {
      const cart = getCart();
      if (cart.length === 0) {
        showToast('Your cart is empty');
        return;
      }
      window.location.href = 'checkout.html';
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>

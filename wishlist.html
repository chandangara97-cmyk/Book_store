<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist – The Reading Nook</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">✦</div>
        <div class="logo-text">
          <h1>THE READING NOOK</h1>
          <span>Books · Ideas · Possibilities</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="wishlist.html" class="icon-btn" title="Wishlist">♡</a>
        <a href="cart.html" class="icon-btn" title="Cart">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <h1>Your Wishlist</h1>
    <p>Books you’re saving for later.</p>
  </div>

  <div class="container">
    <a href="index.html" class="back-link">← Continue Browsing</a>

    <div id="wishlistContent" class="book-grid">
      <!-- Filled by JS -->
    </div>

    <div id="emptyWishlist" class="empty-state" style="display:none">
      <div class="icon">♡</div>
      <h3>Your wishlist is empty</h3>
      <p style="margin: 12px 0 24px;">Tap the heart on any book to save it here.</p>
      <a href="library/all.html" class="btn">Browse Books</a>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 The Reading Nook</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    function renderWishlist() {
      const list = getWishlist();
      const grid = document.getElementById('wishlistContent');
      const empty = document.getElementById('emptyWishlist');

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = list.map(item => `
        <div class="book-card" style="cursor:default">
          <div class="book-cover">${coverHTML(item)}</div>
          <div class="book-info">
            <h3>${item.title}</h3>
            <div class="author">${item.author}</div>
            <div class="meta">₹${item.price}</div>
            <div style="display:flex;gap:8px;margin-top:14px">
              <button class="btn btn-sm" onclick='addToCart(${JSON.stringify(item)}); showToast("Added to cart")'>
                Add to Cart
              </button>
              <button class="btn btn-sm btn-outline" onclick="removeWish('${item.id}')">
                Remove
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function removeWish(id) {
      removeFromWishlist(id);
      renderWishlist();
      showToast('Removed from wishlist');
    }

    document.addEventListener('DOMContentLoaded', renderWishlist);
  </script>
</body>
</html>

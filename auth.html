<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup – The Reading Nook</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-box {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 28px;
      border-bottom: 1.5px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1.5px;
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: system-ui, sans-serif;
      background: #ffffff;
    }
    .auth-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      display: none;
    }
    .auth-message.error { background: #fde8e8; color: #c53030; display: block; }
    .auth-message.success { background: #e9f1ff; color: #1b2a4a; display: block; }
    .user-info {
      text-align: center;
      padding: 20px;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">✦</div>
        <div class="logo-text">
          <h1>THE READING NOOK</h1>
          <span>Books · Ideas · Possibilities</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="wishlist.html" class="icon-btn">♡</a>
        <a href="cart.html" class="icon-btn">
          🛒 <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>

    <div class="auth-box">
      <!-- When logged in -->
      <div id="loggedInView" style="display:none">
        <div class="user-info">
          <div style="font-size:2.5rem;margin-bottom:12px">👤</div>
          <h2 style="margin-bottom:8px">Welcome back!</h2>
          <p id="userEmail" style="color:var(--text-muted);margin-bottom:24px"></p>
          <button class="btn" onclick="handleSignOut()">Sign Out</button>
        </div>
      </div>

      <!-- Login / Signup forms -->
      <div id="authForms">
        <div class="auth-tabs">
          <div class="auth-tab active" data-tab="login">Login</div>
          <div class="auth-tab" data-tab="signup">Sign Up</div>
        </div>

        <!-- Login -->
        <form class="auth-form active" id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6" />
          </div>
          <button type="submit" class="btn btn-block">Login</button>
        </form>

        <!-- Signup -->
        <form class="auth-form" id="signupForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPassword" required placeholder="At least 6 characters" minlength="6" />
          </div>
          <button type="submit" class="btn btn-block">Create Account</button>
        </form>

        <div id="authMessage" class="auth-message"></div>
      </div>
    </div>
  </div>

  <footer class="footer"><p>© 2026 The Reading Nook</p></footer>

  <!-- Firebase SDKs (Compat version for simpler testing) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-analytics-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/store.js"></script>

  <script>
    // Initialize
    initFirebase();

    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
        hideMessage();
      });
    });

    function showMessage(text, type) {
      const el = document.getElementById('authMessage');
      el.textContent = text;
      el.className = 'auth-message ' + type;
    }
    function hideMessage() {
      document.getElementById('authMessage').className = 'auth-message';
    }

    // Auth state
    onAuthChange(user => {
      if (user) {
        document.getElementById('authForms').style.display = 'none';
        document.getElementById('loggedInView').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
      } else {
        document.getElementById('authForms').style.display = 'block';
        document.getElementById('loggedInView').style.display = 'none';
      }
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await signIn(email, password);
        showMessage('Logged in successfully!', 'success');
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    // Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      try {
        await signUp(email, password);
        showMessage('Account created! You are now logged in.', 'success');
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    async function handleSignOut() {
      await signOutUser();
      showMessage('Signed out.', 'success');
    }
  </script>
</body>
</html>
